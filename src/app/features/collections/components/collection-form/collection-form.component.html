<form [formGroup]="form" (ngSubmit)="submitted.emit()">
  <div class="form-body">
    <div class="form-group">
      <label class="form-label">Name</label>
      <input formControlName="name" type="text" class="form-input" placeholder="e.g., Summer Reading" />
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <input
        formControlName="description"
        type="text"
        class="form-input"
        placeholder="What's this collection about?"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Theme Color</label>
      <div class="color-picker">
        <button
          type="button"
          class="color-swatch"
          *ngFor="let color of colors; trackBy: trackByColor"
          (click)="themeControl?.setValue(color)"
          [class]="'color-theme-' + color"
          [class.selected]="themeControl?.value === color"
        ></button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">{{ booksLabel }}</label>
      <div class="book-options" *ngIf="availableBooks.length; else noBooks">
        <label class="book-option" *ngFor="let book of availableBooks; trackBy: trackByBookId">
          <input
            type="checkbox"
            [checked]="selectedBookIds.includes(book.id)"
            (change)="toggleBook.emit({ id: book.id, checked: $any($event.target).checked })"
          />
          <span>{{ book.title }}</span>
        </label>
      </div>
      <ng-template #noBooks>
        <p class="book-empty">{{ emptyBooksText }}</p>
      </ng-template>
    </div>
  </div>

  <div class="form-footer">
    <a [routerLink]="cancelLink" class="button button-secondary" (click)="cancelled.emit()">
      {{ cancelLabel }}
    </a>
    <button type="submit" [disabled]="form.invalid" class="button button-primary">
      {{ submitLabel }}
    </button>
  </div>
</form>
