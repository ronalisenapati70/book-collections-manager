<div class="page-container">
  <header class="page-header">
    <a routerLink="/collections" class="back-link">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="icon"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
        />
      </svg>
      Back to Collections
    </a>
    <h1>Create New Collection</h1>
    <p>Start a new bookshelf for your library.</p>
  </header>

  <div class="form-container">
    <app-collection-form
      [form]="collectionForm"
      [colors]="colors"
      [availableBooks]="unassignedBooks()"
      [selectedBookIds]="selectedBookIds.value"
      submitLabel="Create Collection"
      cancelLink="/collections"
      (submitted)="createCollection()"
      (toggleBook)="toggleBookSelection($event.id, $event.checked)"
    ></app-collection-form>
  </div>
</div>
