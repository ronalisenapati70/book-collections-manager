<div class="page-wrapper">
  <div [class]="'detail-header color-theme-' + (collection()?.theme || 'slate')">
    <div class="header-content">
      <a routerLink="/collections" class="back-link">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
          />
        </svg>
        Back to Collections
      </a>
      <div class="header-main" *ngIf="collection() as col">
        <div>
          <h1>{{ col.name }}</h1>
          <p>{{ col.description }}</p>
        </div>
        <div class="header-actions">
          <button type="button" class="button-outline" (click)="startEditCollection()">
            Edit Collection
          </button>
          <a
            [routerLink]="['/books/new']"
            [queryParams]="{ collectionId: col.id }"
            class="button-add"
          >
            + Add Book
          </a>
        </div>
      </div>

      <div class="edit-collection-card" *ngIf="isEditing()">
        <h2 class="edit-title">Edit Collection</h2>
        <form [formGroup]="collectionForm" (ngSubmit)="saveCollection()">
          <div class="edit-grid">
            <div class="form-group">
              <label class="form-label">Name</label>
              <input formControlName="name" type="text" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <input formControlName="description" type="text" class="form-input" />
            </div>
            <div class="form-group">
              <label class="form-label">Theme Color</label>
              <div class="color-picker">
                <button
                  type="button"
                  class="color-swatch"
                  *ngFor="let color of colors; trackBy: trackByColor"
                  (click)="collectionForm.controls.theme.setValue(color)"
                  [class]="'color-theme-' + color"
                  [class.selected]="collectionForm.controls.theme.value === color"
                ></button>
              </div>
            </div>
          </div>
          <div class="edit-actions">
            <button type="button" class="button button-secondary" (click)="cancelEditCollection()">
              Cancel
            </button>
            <button type="submit" class="button button-primary" [disabled]="collectionForm.invalid">
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="search-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
        <input
          [formControl]="filterControl"
          type="text"
          placeholder="Search by title or author..."
          class="search-input"
        />
      </div>
      <div class="book-count-display">Showing {{ filteredBooks().length }} books</div>
    </div>

    <div class="book-grid">
      <div class="book-card" *ngFor="let book of filteredBooks(); trackBy: trackByBookId">
        <div class="card-image-wrapper">
          <ng-container *ngIf="book.coverUrl; else bookPlaceholder">
            <img [src]="book.coverUrl" [alt]="book.title" class="card-image" loading="lazy" />
          </ng-container>
          <ng-template #bookPlaceholder>
            <div class="book-cover-placeholder"></div>
          </ng-template>
          <div class="image-overlay">
            <span class="rating">
              {{ stars(book.rating) }}
            </span>
          </div>
        </div>
        <div class="card-content">
          <h3>{{ book.title }}</h3>
          <p class="author">{{ book.author }}</p>
          <p class="description">
            {{ book.description }}
          </p>
          <div class="card-actions">
            <a
              [routerLink]="['/books', book.id]"
              class="action-button edit-button"
              aria-label="View or edit book"
              title="View or edit book"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="icon"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.862 4.487 19.5 7.125M16.862 4.487l-9.9 9.9a2.25 2.25 0 0 0-.577 1.034l-.74 2.96 2.96-.74a2.25 2.25 0 0 0 1.034-.577l9.9-9.9M16.862 4.487 19.5 7.125"
                />
              </svg>
            </a>
            <button
              type="button"
              (click)="confirmDeleteBook(book)"
              class="action-button remove-button"
              aria-label="Remove book"
              title="Remove book"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="icon"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="empty-state" *ngIf="filteredBooks().length === 0">
        <p>No books found in this collection.</p>
        <p>Try adding a new book to get started.</p>
      </div>
    </div>
  </div>
</div>

<app-confirm-modal
  [isOpen]="!!bookToDelete()"
  title="Remove Book"
  [message]="'Are you sure you want to remove ' + bookToDelete()?.title + ' from this collection?'"
  (onConfirm)="deleteBook()"
  (onCancel)="bookToDelete.set(null)"
></app-confirm-modal>
