<div class="page-wrapper collection-detail">
  <div [class]="'detail-header color-theme-' + (collection()?.theme || 'slate')">
    <div class="header-content">
      <a routerLink="/collections" class="back-link">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
          />
        </svg>
        Back to Collections
      </a>
      <div class="header-main" *ngIf="collection() as col">
        <div>
          <h1>{{ col.name }}</h1>
          <p>{{ col.description }}</p>
        </div>
        <div class="header-actions">
          <button type="button" class="button-outline" (click)="startEditCollection()">
            Edit Collection
          </button>
          <a
            *ngIf="collectionId() !== null"
            [routerLink]="['/books/new']"
            [queryParams]="{ collectionId: collectionId()! }"
            class="button-add"
          >
            + Add Book
          </a>
        </div>
      </div>

      <div class="edit-collection-card" *ngIf="isEditing()">
        <h2 class="edit-title">Edit Collection</h2>
        <app-collection-form
          [form]="collectionForm"
          [colors]="colors"
          [availableBooks]="availableBooks()"
          [selectedBookIds]="selectedBookIds.value"
          submitLabel="Save Changes"
          [cancelLink]="collectionId() === null ? '/collections' : '/collections/' + collectionId()"
          booksLabel="Add Books"
          (submitted)="saveCollection()"
          (cancelled)="cancelEditCollection()"
          (toggleBook)="toggleBookSelection($event.id, $event.checked)"
        ></app-collection-form>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="filter-bar">
      <div class="search-input-wrapper">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="search-icon"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
        <input
          [formControl]="filterControl"
          type="text"
          placeholder="Search by title or author..."
          class="search-input"
        />
      </div>
      <div class="book-count-display">Showing {{ filteredBooks().length }} books</div>
    </div>

    <div class="book-grid">
      <app-book-card
        *ngFor="let book of filteredBooks(); trackBy: trackByBookId"
        [book]="book"
        [cardLink]="['/collections', collectionId(), 'books', book.id]"
        [theme]="getCollectionTheme()"
        (remove)="confirmDeleteBook($event)"
      ></app-book-card>
      <div class="empty-state" *ngIf="filteredBooks().length === 0">
        <p>No books found in this collection.</p>
        <p>Try adding a new book to get started.</p>
      </div>
    </div>
  </div>
</div>

<app-confirm-modal
  [isOpen]="!!bookToDelete()"
  title="Remove Book"
  [message]="'Are you sure you want to remove ' + bookToDelete()?.title + ' from this collection?'"
  (onConfirm)="deleteBook()"
  (onCancel)="bookToDelete.set(null)"
></app-confirm-modal>
