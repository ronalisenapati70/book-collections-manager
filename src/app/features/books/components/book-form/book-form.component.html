<form [formGroup]="form" (ngSubmit)="submitted.emit()">
  <div class="form-body">
    <div class="form-left">
      <div class="form-group">
        <label class="form-label">Collection</label>
        <select formControlName="collectionId" class="form-input form-select">
          <option [ngValue]="null">No collection</option>
          <option
            *ngFor="let col of collections; trackBy: trackByCollectionId"
            [ngValue]="col.id"
          >
            {{ col.name }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Title</label>
        <input
          formControlName="title"
          type="text"
          class="form-input"
          placeholder="Enter book title"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Author</label>
        <input
          formControlName="author"
          type="text"
          class="form-input"
          placeholder="Enter book author"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Rating</label>
        <select formControlName="rating" class="form-input form-select">
          <option [ngValue]="5">5 (Excellent)</option>
          <option [ngValue]="4">4 (Great)</option>
          <option [ngValue]="3">3 (Good)</option>
          <option [ngValue]="2">2 (Fair)</option>
          <option [ngValue]="1">1 (Poor)</option>
        </select>
      </div>
    </div>

    <div class="form-right">
      <label class="form-label">Description</label>
      <textarea
        formControlName="description"
        class="form-input form-textarea"
        placeholder="Enter book description"
      ></textarea>
    </div>
  </div>

  <div class="form-footer">
    <a [routerLink]="cancelLink" class="button button-secondary">Cancel</a>
    <button type="submit" [disabled]="form.invalid" class="button button-primary">
      {{ isEditMode ? 'Update Book' : 'Save Book' }}
    </button>
  </div>
</form>
