<div class="book-card" [routerLink]="cardLink" role="link" tabindex="0">
  <div class="color-strip" [class]="'color-strip color-theme-' + theme" aria-hidden="true"></div>
  <div class="card-content">
    <div class="card-header">
      <h3 class="title">{{ book.title }}</h3>
      <span class="rating-pill">{{ ratingLabel }}</span>
    </div>
    <p class="author">{{ book.author }}</p>

    <div class="collection-chip-wrapper" *ngIf="collectionName && collectionLink">
      <a
        [routerLink]="collectionLink"
        class="collection-chip"
        (click)="$event.stopPropagation()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 16 16"
          fill="currentColor"
          class="chip-icon"
          aria-hidden="true"
        >
          <path d="M2 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3Z" />
          <path
            fill-rule="evenodd"
            d="M13 6H3v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6ZM8.75 8a.75.75 0 0 0-1.5 0v1.25H6a.75.75 0 0 0 0 1.5h1.25V12a.75.75 0 0 0 1.5 0v-1.25H10a.75.75 0 0 0 0-1.5H8.75V8Z"
            clip-rule="evenodd"
          />
        </svg>
        {{ collectionName }}
      </a>
    </div>

    <p class="description">
      {{ book.description }}
    </p>

    <div class="card-actions">
      <button
        type="button"
        class="action-button remove-button"
        aria-label="Remove book"
        title="Remove book"
        (click)="onRemove($event)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="icon"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
